<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cardápio · Rio Restaurante &amp; Bar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Poppins:wght@300;400;500;600;700&family=Caveat:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink-900:#0d1219;
    --ink-800:#141b26;
    --panel:#152018;
    --gold-500:#c9973b;
    --gold-400:#e6bf6a;
    --gold-300:#f3ddab;
    --cream:#f7f4ec;
    --muted:#a9a598;
    --white:#ffffff;
    --ease:cubic-bezier(.22,1,.36,1);
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    font-family:'Poppins',sans-serif;
    background:var(--ink-900);
    color:var(--cream);
  }
  .script{ font-family:'Caveat',cursive; font-weight:600; }
  a{ color:inherit; }
  button{ font-family:inherit; cursor:pointer; }

  @media (prefers-reduced-motion: reduce){
    *{ animation:none !important; transition:none !important; scroll-behavior:auto !important; }
  }

  /* ============ TOP BANNER ============ */
  .banner{
    position:relative;
    padding:40px 20px 34px;
    text-align:center;
    background:
      linear-gradient(180deg, rgba(13,18,25,.55) 0%, rgba(13,18,25,.85) 70%, var(--ink-900) 100%),
      url('https://images.unsplash.com/photo-1516307365426-bea591f05011?auto=format&fit=crop&w=1200&q=70') center 40%/cover no-repeat;
  }
  .logo-mark{
    width:38px; height:38px; border-radius:50%; margin:0 auto 10px;
    background:radial-gradient(circle at 35% 30%, var(--gold-400), var(--gold-500) 70%);
    position:relative;
  }
  .logo-mark::after{
    content:""; position:absolute; inset:10px; background:var(--ink-900); border-radius:50%;
  }
  .banner h1{
    font-family:'Playfair Display', serif; font-weight:700;
    font-size:2.6rem; margin:0; color:var(--gold-400);
    text-shadow:0 4px 18px rgba(0,0,0,.5);
  }
  .banner .sub{
    letter-spacing:3px; font-size:.72rem; color:var(--gold-300); margin:2px 0 14px;
  }
  .banner .tag{
    font-size:1.2rem; color:var(--gold-300); margin:0;
  }

  /* ============ INSTAGRAM CTA ============ */
  .insta-bar{
    display:flex; justify-content:center; padding:18px 20px 6px;
  }
  .insta-btn{
    display:inline-flex; align-items:center; gap:10px;
    padding:13px 26px; border-radius:100px;
    background:linear-gradient(135deg, var(--gold-400), var(--gold-500));
    color:var(--ink-900); font-weight:600; font-size:.94rem;
    text-decoration:none;
    box-shadow:0 10px 26px rgba(201,151,59,.28);
    transition:transform .3s var(--ease), box-shadow .3s var(--ease);
  }
  .insta-btn:hover{ transform:translateY(-3px); box-shadow:0 16px 32px rgba(201,151,59,.4); }
  .insta-btn svg{ width:18px; height:18px; }

  .home-bar{ display:flex; justify-content:center; padding:8px 20px 4px; }
  .home-btn{
    display:inline-flex; align-items:center; gap:9px;
    padding:12px 24px; border-radius:100px;
    background:transparent; border:1.5px solid rgba(230,191,106,.45);
    color:var(--gold-300); font-weight:600; font-size:.9rem;
    text-decoration:none;
    transition:transform .3s var(--ease), border-color .3s ease, background .3s ease;
  }
  .home-btn:hover{ transform:translateY(-3px); border-color:var(--gold-400); background:rgba(230,191,106,.08); }
  .home-btn svg{ width:16px; height:16px; }

  /* ============ TABS ============ */
  .tabs{
    position:sticky; top:0; z-index:10;
    display:flex; gap:10px; overflow-x:auto;
    padding:14px 18px; background:var(--ink-900);
    border-bottom:1px solid rgba(230,191,106,.14);
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
  }
  .tabs::-webkit-scrollbar{ display:none; }
  .tab-btn{
    flex:0 0 auto;
    display:flex; align-items:center; gap:8px;
    padding:10px 18px; border-radius:100px; border:1px solid rgba(230,191,106,.3);
    background:transparent; color:var(--gold-300); font-weight:600; font-size:.86rem;
    white-space:nowrap;
    transition:background .3s ease, color .3s ease, transform .3s var(--ease), border-color .3s ease;
  }
  .tab-btn svg{ width:16px; height:16px; }
  .tab-btn:hover{ transform:translateY(-2px); border-color:var(--gold-400); }
  .tab-btn.active{
    background:linear-gradient(135deg, var(--gold-400), var(--gold-500));
    color:var(--ink-900); border-color:transparent;
  }

  /* ============ MENU ============ */
  .menu-wrap{
    max-width:640px; margin:0 auto; padding:26px 18px 60px;
  }
  .category{
    border:1px solid rgba(230,191,106,.18);
    border-radius:16px;
    margin-bottom:14px;
    overflow:hidden;
    background:var(--panel);
  }
  .category-head{
    width:100%; display:flex; align-items:center; gap:12px;
    padding:16px 18px; background:none; border:none; text-align:left;
    color:var(--gold-300); font-family:'Playfair Display', serif; font-weight:700; font-size:1.08rem;
  }
  .category-head .ico{
    width:30px; height:30px; flex-shrink:0; color:var(--ink-900);
    background:linear-gradient(135deg, var(--gold-400), var(--gold-500));
    border-radius:8px; display:flex; align-items:center; justify-content:center;
  }
  .category-head .ico svg{ width:17px; height:17px; }
  .category-head span.name{ flex:1; }
  .category-head .chevron{
    width:18px; height:18px; color:var(--gold-400);
    transition:transform .35s var(--ease);
    flex-shrink:0;
  }
  .category.open .chevron{ transform:rotate(180deg); }
  .category-body{
    max-height:0; overflow:hidden;
    transition:max-height .45s var(--ease);
  }
  .category-body ul{
    list-style:none; margin:0; padding:0 18px 16px;
  }
  .category-body li{
    display:flex; align-items:baseline; gap:8px;
    padding:9px 0; font-size:.92rem;
    border-bottom:1px dashed rgba(255,255,255,.08);
  }
  .category-body li:last-child{ border-bottom:none; }
  .item-name{ color:var(--cream); }
  .dots{ flex:1; border-bottom:1px dotted rgba(255,255,255,.22); transform:translateY(-3px); }
  .item-price{ color:var(--gold-400); font-weight:600; white-space:nowrap; }

  .footer-note{
    text-align:center; padding:10px 20px 50px; color:var(--muted); font-size:.82rem; line-height:1.7;
  }
  .footer-note .script{ display:block; font-size:1.3rem; color:var(--gold-300); margin-bottom:6px; }

  @media (max-width:420px){
    .banner h1{ font-size:2.1rem; }
    .banner .tag{ font-size:1.05rem; }
  }
</style>
</head>
<body>

<div class="banner">
  <div class="logo-mark"></div>
  <h1>Rio</h1>
  <p class="sub">RESTAURANTE &amp; BAR</p>
  <p class="tag script">Sinta o Rio. Viva o Momento.</p>
</div>

<div class="insta-bar">
  <a class="insta-btn" href="https://www.instagram.com/riorestaurantebar" target="_blank" rel="noopener">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1"/></svg>
    Siga-nos no Instagram
  </a>
</div>

<div class="tabs" id="tabs"></div>

<div class="menu-wrap" id="menu-wrap"></div>

<div class="home-bar">
  <a class="home-btn" href="index.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
    Ir à Página Inicial
  </a>
</div>

<p class="footer-note">
  <span class="script">Obrigado pela visita!</span>
  © 2026 Rio Restaurante &amp; Bar
</p>

<script>
const ICONS = {
  bowl: '<path d="M4 12h16M4 12a8 6 0 0 0 16 0M9 12v-2M15 12v-2"/><path d="M6 5c1-1 3-2 6-2s5 1 6 2"/>',
  cow: '<path d="M4 9c1-2 3-3 4-3M20 9c-1-2-3-3-4-3M6 6l1 3M18 6l-1 3M7 10c0-2 2-4 5-4s5 2 5 4v4c0 3-2 5-5 5s-5-2-5-5v-4z"/>',
  fish: '<path d="M3 12c3-4 8-6 13-4 2 .8 4 2.4 5 4-1 1.6-3 3.2-5 4-5 2-10 0-13-4z"/><path d="M16 8v8M9 10.5c-.6.6-.6 2.4 0 3"/>',
  tray: '<circle cx="12" cy="11" r="7"/><path d="M5 20h14M9 20v-2M15 20v-2"/>',
  flute: '<path d="M12 3c2 3 3 5 3 7a3 3 0 0 1-6 0c0-2 1-4 3-7z"/><path d="M12 10v10M8 20h8"/>',
  wine: '<path d="M7 3h10l-1 6a4 4 0 0 1-8 0L7 3z"/><path d="M12 13v7M8 20h8"/>',
  cocktail: '<path d="M4 4h16l-8 9-8-9z"/><path d="M12 13v7M8 20h8"/><path d="M8 4l4 5 4-5" opacity="0"/>',
  cup: '<path d="M6 9h12l-1 9a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2L6 9z"/><path d="M4 9h16M14 9c0-3-1-5-2-6-1 1-2 3-2 6"/>',
  pitcher: '<path d="M6 4h9l-1 15a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2L6 4z"/><path d="M15 8h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2h-3"/><path d="M6 4H5"/>',
  whisky: '<rect x="5" y="9" width="8" height="11" rx="1"/><path d="M7 13h4"/><path d="M11 3h4l1 4h-6z"/><path d="M13 7v2"/>',
  martini: '<path d="M4 4h16l-8 9-8-9z"/><path d="M12 13v7M8 20h8"/>',
  aperitif: '<path d="M8 4h8l-1 4H9l-1-4z"/><path d="M12 8v12M8 20h8"/><path d="M9 12h6"/>'
};

const GROUPS = [
  {
    id:"comidas", title:"Comidas", icon:"cow",
    categories:[
      { title:"Entradas", icon:"bowl", items:[
        ["Chamussas","200"],["Rissóis de Camarão","200"],["Chouricinho","250"],
        ["Pão de Alho","200"],["Sopa de Peixe","200"]
      ]},
      { title:"Carnes Grelhadas", icon:"cow", items:[
        ["Picanha 350gr","1.200"],["Picanha 800gr","2.900"],["Alcatra 300gr","950"],
        ["T-Bone 400gr","950"],["Rib Eye 400gr","950"],["Rib Eye 600gr","1.350"],
        ["Costelitas de Porco 300gr","750"],["Entremeada 300gr","850"],
        ["Frango ½","550"],["Frango Inteiro","950"],["Peito de Frango","650"]
      ]},
      { title:"Mariscos Grelhados", icon:"fish", items:[
        ["Camarão K","1.400"],["Lulas","900"],["Peixe Vermelho","900"],["Peixe Garoupa","1.050"]
      ]},
      { title:"Outros", icon:"tray", items:[
        ["Prego no Prato","500"],["Hambúrguer","500"],["Chouriço Grelhado c/ Batata Frita","500"]
      ]}
    ]
  },
  {
    id:"quentes", title:"Bebidas Quentes", icon:"whisky",
    categories:[
      { title:"Whisky", icon:"whisky", items:[
        ["John Walker Red","80"],["John Walker Black","150"],["Jameson Original","110"],
        ["Jameson Black Barrel","200"],["Jack Daniel","140"],["Macallan","150"],["Chivas Regal","180"]
      ]},
      { title:"Gin", icon:"martini", items:[
        ["Gordon Gin","50"],["Tanqueray","120"],["Bombay","120"],["Hendrick's","200"]
      ]},
      { title:"Aperitivos", icon:"aperitif", items:[
        ["1920","100"],["São Domingos","100"],["Amargula","80"],["Martini","80"],
        ["Jägermeister","140"],["Tequila Silver","140"],["Tequila Reposado","140"],["Tequila Chocolate","150"]
      ]}
    ]
  },
  {
    id:"bebidas", title:"Bebidas", icon:"cocktail",
    categories:[
      { title:"Cocktails", icon:"cocktail", items:[
        ["Margarita","350"],["Piña Colada","350"],["Sex on the Beach","350"],
        ["Long Island Ice Tea","350"],["Mojito","350"],["Blue Lagoon","350"],["Strawberry Daiquiri","350"]
      ]},
      { title:"Caipirinhas", icon:"cup", items:[
        ["Maracujá","350"],["Limão","350"],["Morango","350"],["Ananás","350"]
      ]},
      { title:"Sangrias", icon:"pitcher", items:[
        ["Dark Love","1.200"],["Dark White","1.200"],["Viva La Vida","1.500"]
      ]}
    ]
  },
  {
    id:"vinhos", title:"Vinhos", icon:"wine",
    categories:[
      { title:"Espumante", icon:"flute", items:[
        ["J.C. Le Domaine","900"],["Anabelle","900"],["Tosti","1.700"],["Chandon","700"]
      ]},
      { title:"Vinhos Brancos", icon:"wine", items:[
        ["Silk & Spice","1.700"],["Planalto","1.600"],["Portada","1.100"],["Cabriz","1.000"],
        ["Borba","900"],["Pé Branco","700"],["Boehendal","1.500"]
      ]},
      { title:"Vinhos Tintos", icon:"wine", items:[
        ["Silk & Spice","1.700"],["Portada","1.100"],["Pé Tinto","700"],["Borba","900"],
        ["Cabriz","1.000"],["Four Cousin","700"],["Musch Mais","2.200"],
        ["Segredos de São Miguel","1.200"],["Reserva da Família","1.200"]
      ]},
      { title:"Vinhos Verdes", icon:"wine", items:[
        ["Aveleda Alvarinho","1.000"],["Gazela","900"],["Gatão","800"],["Casal Garcia","1.000"]
      ]}
    ]
  }
];

const tabsEl = document.getElementById('tabs');
const wrap = document.getElementById('menu-wrap');

function renderCategories(categories){
  wrap.innerHTML = categories.map((cat, i) => `
    <div class="category${i===0 ? ' open':''}" data-idx="${i}">
      <button class="category-head" aria-expanded="${i===0}">
        <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICONS[cat.icon]}</svg></span>
        <span class="name">${cat.title}</span>
        <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="6 9 12 15 18 9"/></svg>
      </button>
      <div class="category-body">
        <ul>
          ${cat.items.map(([name, price]) => `
            <li><span class="item-name">${name}</span><span class="dots"></span><span class="item-price">${price} MT</span></li>
          `).join('')}
        </ul>
      </div>
    </div>
  `).join('');

  document.querySelectorAll('.category').forEach(cat => {
    const body = cat.querySelector('.category-body');
    if(cat.classList.contains('open')) setHeight(body, true);
    cat.querySelector('.category-head').addEventListener('click', () => {
      const isOpen = cat.classList.contains('open');
      cat.classList.toggle('open', !isOpen);
      cat.querySelector('.category-head').setAttribute('aria-expanded', String(!isOpen));
      setHeight(body, !isOpen);
    });
  });
}

function setHeight(body, open){
  body.style.maxHeight = open ? body.scrollHeight + 'px' : '0px';
}

function selectGroup(id){
  GROUPS.forEach(g => {
    document.getElementById('tab-' + g.id).classList.toggle('active', g.id === id);
  });
  const group = GROUPS.find(g => g.id === id);
  renderCategories(group.categories);
}

tabsEl.innerHTML = GROUPS.map(g => `
  <button class="tab-btn" id="tab-${g.id}" data-id="${g.id}">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICONS[g.icon]}</svg>
    ${g.title}
  </button>
`).join('');

tabsEl.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => selectGroup(btn.dataset.id));
});

selectGroup(GROUPS[0].id);

window.addEventListener('resize', () => {
  document.querySelectorAll('.category.open .category-body').forEach(body => {
    body.style.maxHeight = body.scrollHeight + 'px';
  });
});
</script>
</body>
</html>
