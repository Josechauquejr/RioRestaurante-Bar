<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cardápio · Rio Restaurante &amp; Bar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500;1,9..144,600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink-900:#160f0d;
    --line:rgba(216,159,60,.24);
    --gold-500:#c2872f;
    --gold-400:#d9a13c;
    --gold-300:#eec87c;
    --coral-500:#c8663f;
    --coral-400:#dd8a5c;
    --sand:#f2e6d3;
    --muted:#a08f80;
    --white:#ffffff;
    --ease:cubic-bezier(.22,1,.36,1);
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    font-family:'Manrope',sans-serif;
    background:var(--ink-900);
    color:var(--sand);
  }
  .script{ font-family:'Fraunces',serif; font-style:italic; font-weight:500; }
  a{ color:inherit; }
  button{ font-family:inherit; cursor:pointer; }

  @media (prefers-reduced-motion: reduce){
    *{ animation:none !important; transition:none !important; scroll-behavior:auto !important; }
  }

  /* ============ TOP BANNER — real sunset-over-the-river photo ============ */
  .sr-only{
    position:absolute; width:1px; height:1px; margin:-1px; overflow:hidden;
    clip:rect(0,0,0,0); white-space:nowrap;
  }
  .banner{
    position:relative; max-width:520px; margin:0 auto; overflow:hidden; background:var(--ink-900);
  }
  .banner-photo{
    display:block; width:100%; height:auto;
  }
  .banner::after{
    content:""; position:absolute; inset:0; pointer-events:none;
    background:linear-gradient(180deg, rgba(22,15,13,0) 90%, var(--ink-900) 100%);
  }

  /* ============ INSTAGRAM CTA ============ */
  .insta-bar{
    display:flex; justify-content:center; padding:18px 20px 6px;
  }
  .insta-btn{
    display:inline-flex; align-items:center; gap:10px;
    padding:13px 26px; border-radius:100px;
    background:linear-gradient(135deg, var(--gold-300), var(--coral-500));
    color:var(--ink-900); font-weight:700; font-size:.86rem; letter-spacing:.3px;
    text-decoration:none; text-transform:uppercase;
    box-shadow:0 10px 26px rgba(217,117,81,.3);
    transition:transform .3s var(--ease), box-shadow .3s var(--ease);
  }
  .insta-btn:hover{ transform:translateY(-3px); box-shadow:0 16px 32px rgba(232,121,79,.42); }
  .insta-btn svg{ width:18px; height:18px; }

  .home-bar{ display:flex; justify-content:center; padding:8px 20px 4px; }
  .home-btn{
    display:inline-flex; align-items:center; gap:9px;
    padding:12px 24px; border-radius:100px;
    background:transparent; border:1.5px solid rgba(216,159,60,.4);
    color:var(--gold-300); font-weight:700; font-size:.8rem; letter-spacing:.3px; text-transform:uppercase;
    text-decoration:none;
    transition:transform .3s var(--ease), border-color .3s ease, background .3s ease;
  }
  .home-btn:hover{ transform:translateY(-3px); border-color:var(--gold-400); background:rgba(216,159,60,.08); }
  .home-btn svg{ width:16px; height:16px; }

  /* ============ TABS — editorial underline nav ============ */
  .tabs{
    position:sticky; top:0; z-index:10;
    display:flex; gap:8px; overflow-x:auto; justify-content:center;
    padding:0 14px; background:rgba(22,15,13,.92); backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
    -webkit-overflow-scrolling:touch;
    scrollbar-width:none;
  }
  .tabs::-webkit-scrollbar{ display:none; }
  .tab-btn{
    flex:0 0 auto; position:relative;
    display:flex; align-items:center; gap:7px;
    padding:18px 14px 15px; border:none;
    background:transparent; color:var(--muted); font-weight:700; font-size:.76rem;
    letter-spacing:.6px; text-transform:uppercase;
    white-space:nowrap;
    transition:color .3s ease;
  }
  .tab-btn svg{ width:15px; height:15px; opacity:.85; }
  .tab-btn::after{
    content:""; position:absolute; left:14px; right:14px; bottom:0; height:2px;
    background:linear-gradient(90deg, var(--gold-400), var(--coral-400));
    transform:scaleX(0); transform-origin:center; transition:transform .35s var(--ease);
  }
  .tab-btn:hover{ color:var(--gold-300); }
  .tab-btn.active{ color:var(--gold-300); }
  .tab-btn.active::after{ transform:scaleX(1); }

  /* ============ MENU — printed-menu sections ============ */
  .menu-wrap{
    max-width:600px; margin:0 auto; padding:12px 22px 60px;
  }
  .category{
    border-top:1px solid var(--line);
  }
  .category:first-child{ border-top:none; }
  .category-head{
    width:100%; display:flex; align-items:center; gap:14px;
    padding:24px 0 22px; background:none; border:none; text-align:left;
  }
  .category-head .ico{
    width:38px; height:38px; flex-shrink:0; color:var(--gold-300);
    border:1px solid rgba(217,168,96,.45); background:rgba(217,168,96,.06);
    border-radius:50%; display:flex; align-items:center; justify-content:center;
  }
  .category-head .ico svg{ width:18px; height:18px; }
  .category-head span.name{
    flex:1; color:var(--gold-300);
    font-family:'Fraunces', serif; font-weight:600; font-style:italic; font-size:1.3rem;
  }
  .category-head .chevron{
    width:16px; height:16px; color:var(--muted);
    transition:transform .35s var(--ease);
    flex-shrink:0;
  }
  .category.open .chevron{ transform:rotate(180deg); color:var(--gold-400); }
  .category-body{
    max-height:0; overflow:hidden;
    transition:max-height .45s var(--ease);
  }
  .category-body ul{
    list-style:none; margin:0; padding:0 0 22px 52px;
  }
  .category-body li{
    display:flex; align-items:baseline; gap:8px;
    padding:10px 0; font-size:.96rem;
  }
  .item-name{ color:var(--sand); font-weight:500; }
  .dots{ flex:1; border-bottom:1px dotted rgba(243,234,217,.2); transform:translateY(-3px); }
  .item-price{
    color:var(--gold-400); font-weight:700; white-space:nowrap;
    font-variant-numeric:tabular-nums; font-size:.9rem;
  }

  .footer-note{
    text-align:center; padding:20px 20px 50px; color:var(--muted); font-size:.8rem; line-height:1.7;
  }
  .footer-note .script{ display:block; font-size:1.35rem; color:var(--gold-300); margin-bottom:6px; }

  @media (max-width:420px){
    .category-body ul{ padding-left:0; }
  }
</style>
</head>
<body>

<div class="banner">
  <img class="banner-photo" src="hero-rio.jpg" width="853" height="1280" alt="Rio Restaurante &amp; Bar — Sinta o Rio. Viva o Pôr do Sol.">
  <h1 class="sr-only">Rio Restaurante &amp; Bar</h1>
</div>

<div class="insta-bar">
  <a class="insta-btn" href="https://www.instagram.com/riorestauranteebar?stkn=aWE5NzM1ZDZ1emJs" target="_blank" rel="noopener">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1"/></svg>
    Siga-nos no Instagram
  </a>
</div>

<div class="tabs" id="tabs"></div>

<div class="menu-wrap" id="menu-wrap"></div>

<div class="home-bar">
  <a class="home-btn" href="index.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
    Ir à Página Inicial
  </a>
</div>

<p class="footer-note">
  <span class="script">Obrigado pela visita!</span>
  © 2026 Rio Restaurante &amp; Bar
</p>

<script>
const ICONS = {
  bowl: '<path d="M4 11.5h16a8 5.5 0 0 1-16 0z"/><path d="M6.4 11.5c-.3-1.6.4-2.8 1.8-3.6M17.6 11.5c.3-1.6-.4-2.8-1.8-3.6"/><path d="M9.4 4.6c-.6.5-.6 1.1 0 1.6M14.6 4.6c-.6.5-.6 1.1 0 1.6"/>',
  cow: '<path d="M6 8.4c-.8-1.5-.4-2.9.8-3.5M18 8.4c.8-1.5.4-2.9-.8-3.5"/><path d="M7 9c0-2.6 2.2-4.6 5-4.6s5 2 5 4.6v3.3c0 3-2.2 5-5 5s-5-2-5-5V9z"/><circle cx="9.6" cy="9.3" r=".55" fill="currentColor" stroke="none"/><circle cx="14.4" cy="9.3" r=".55" fill="currentColor" stroke="none"/><path d="M10.5 12.1c.5.5 2.5.5 3 0"/><path d="M4.4 10.3c-1 .2-1.6 1.1-1.3 2.2M19.6 10.3c1 .2 1.6 1.1 1.3 2.2"/>',
  fish: '<path d="M2.5 12c3.2-4.3 8.4-6.2 13.3-4.2 2 .8 3.8 2.3 4.7 4.2-.9 1.9-2.7 3.4-4.7 4.2-4.9 2-10.1.1-13.3-4.2z"/><path d="M16.4 8.2v7.6"/><path d="M9 9.8c-.7.6-.7 2.8 0 3.4M12 9.3c-.6.7-.6 3.3 0 4"/><circle cx="4.7" cy="11.3" r=".55" fill="currentColor" stroke="none"/>',
  tray: '<path d="M4 13a8 6 0 0 1 16 0z"/><path d="M2.4 13h19.2"/><path d="M12 8V5.2"/><circle cx="12" cy="4.2" r="1" fill="currentColor" stroke="none"/><path d="M5.4 19.4h13.2M9 19.4v-1.8M15 19.4v-1.8"/>',
  flute: '<path d="M12 3.2c1.8 2.6 2.6 4.6 2.6 6.4a2.6 2.6 0 0 1-5.2 0c0-1.8.8-3.8 2.6-6.4z"/><path d="M12 10.2V20M8.2 20h7.6"/><circle cx="11.2" cy="7.4" r=".45" fill="currentColor" stroke="none"/><circle cx="12.6" cy="5.7" r=".4" fill="currentColor" stroke="none"/><circle cx="11.6" cy="4.6" r=".35" fill="currentColor" stroke="none"/>',
  wine: '<path d="M7.2 3.2h9.6l-1 6.2a4.8 4.8 0 0 1-7.6 0z"/><path d="M12 13.6V20M8.2 20h7.6"/><path d="M8.2 6.6h7.6"/><path d="M9.2 4.6c.4.5.4 1 0 1.5"/>',
  cocktail: '<path d="M4 4h16l-8 9-8-9z"/><path d="M12 13v6.4M8.4 20h7.2"/><path d="M9.5 4.8 12 8l2.5-3.2"/><path d="M15 2.2l1.4 1.4M16.4 2.2l-1.4 1.4"/>',
  cup: '<path d="M6.4 9h11.2l-1 9.4a2 2 0 0 1-2 1.8H9.4a2 2 0 0 1-2-1.8L6.4 9z"/><path d="M4.6 9h14.8"/><path d="M9.2 12.2h1.8M13 13.2h1.6"/><path d="M15.6 4.4 13.8 9"/>',
  pitcher: '<path d="M6 4.4h9l-1 14.6a2 2 0 0 1-2 1.9H9a2 2 0 0 1-2-1.9L6 4.4z"/><path d="M15.4 8h2.6a2 2 0 0 1 2 2v2.6a2 2 0 0 1-2 2h-2.6"/><path d="M5.6 4.4H4.6"/><path d="M7.2 9.4h6.6"/><circle cx="10.4" cy="12.6" r="1" fill="none"/>',
  whisky: '<rect x="5" y="8.6" width="9" height="11.4" rx="1"/><path d="M6.6 12.6h5.8"/><rect x="7.2" y="14.4" width="2.2" height="2.2" rx=".3"/><rect x="9.8" y="15.8" width="2" height="2" rx=".3"/><path d="M11 3h3.4l1 4h-5.4z"/><path d="M13 7v1.6"/>',
  martini: '<path d="M4 4h16l-8 9-8-9z"/><path d="M12 13v6.4M8.4 20h7.2"/><circle cx="9.6" cy="6.2" r="1" fill="currentColor" stroke="none"/><path d="M9.6 6.2 12 4"/>',
  aperitif: '<path d="M7.6 4h8.8l-.9 4.4H8.5L7.6 4z"/><path d="M12 8.4v11.6M8.2 20h7.6"/><path d="M9 6.2h6"/><path d="M9.4 2.2c1 1 1 2.2 0 3.2"/>'
};

const GROUPS = [
  {
    id:"comidas", title:"Comidas", icon:"cow",
    categories:[
      { title:"Entradas", icon:"bowl", items:[
        ["Chamussas","200"],["Rissóis de Camarão","200"],["Chouricinho","250"],
        ["Pão de Alho","200"],["Sopa de Peixe","200"]
      ]},
      { title:"Carnes Grelhadas", icon:"cow", items:[
        ["Picanha 350gr","1.200"],["Picanha 800gr","2.900"],["Alcatra 300gr","950"],
        ["T-Bone 400gr","950"],["Rib Eye 400gr","950"],["Rib Eye 600gr","1.350"],
        ["Costelitas de Porco 300gr","750"],["Entremeada 300gr","850"],
        ["Frango ½","550"],["Frango Inteiro","950"],["Peito de Frango","650"]
      ]},
      { title:"Mariscos Grelhados", icon:"fish", items:[
        ["Camarão K","1.400"],["Lulas","900"],["Peixe Vermelho","900"],["Peixe Garoupa","1.050"]
      ]},
      { title:"Outros", icon:"tray", items:[
        ["Prego no Prato","500"],["Hambúrguer","500"],["Chouriço Grelhado c/ Batata Frita","500"]
      ]}
    ]
  },
  {
    id:"quentes", title:"Bebidas Quentes", icon:"whisky",
    categories:[
      { title:"Whisky", icon:"whisky", items:[
        ["John Walker Red","80"],["John Walker Black","150"],["Jameson Original","110"],
        ["Jameson Black Barrel","200"],["Jack Daniel","140"],["Macallan","150"],["Chivas Regal","180"]
      ]},
      { title:"Gin", icon:"martini", items:[
        ["Gordon Gin","50"],["Tanqueray","120"],["Bombay","120"],["Hendrick's","200"]
      ]},
      { title:"Aperitivos", icon:"aperitif", items:[
        ["1920","100"],["São Domingos","100"],["Amargula","80"],["Martini","80"],
        ["Jägermeister","140"],["Tequila Silver","140"],["Tequila Reposado","140"],["Tequila Chocolate","150"]
      ]}
    ]
  },
  {
    id:"bebidas", title:"Bebidas", icon:"cocktail",
    categories:[
      { title:"Cocktails", icon:"cocktail", items:[
        ["Margarita","350"],["Piña Colada","350"],["Sex on the Beach","350"],
        ["Long Island Ice Tea","350"],["Mojito","350"],["Blue Lagoon","350"],["Strawberry Daiquiri","350"]
      ]},
      { title:"Caipirinhas", icon:"cup", items:[
        ["Maracujá","350"],["Limão","350"],["Morango","350"],["Ananás","350"]
      ]},
      { title:"Sangrias", icon:"pitcher", items:[
        ["Dark Love","1.200"],["Dark White","1.200"],["Viva La Vida","1.500"]
      ]}
    ]
  },
  {
    id:"vinhos", title:"Vinhos", icon:"wine",
    categories:[
      { title:"Espumante", icon:"flute", items:[
        ["J.C. Le Domaine","900"],["Anabelle","900"],["Tosti","1.700"],["Chandon","700"]
      ]},
      { title:"Vinhos Brancos", icon:"wine", items:[
        ["Silk & Spice","1.700"],["Planalto","1.600"],["Portada","1.100"],["Cabriz","1.000"],
        ["Borba","900"],["Pé Branco","700"],["Boehendal","1.500"]
      ]},
      { title:"Vinhos Tintos", icon:"wine", items:[
        ["Silk & Spice","1.700"],["Portada","1.100"],["Pé Tinto","700"],["Borba","900"],
        ["Cabriz","1.000"],["Four Cousin","700"],["Musch Mais","2.200"],
        ["Segredos de São Miguel","1.200"],["Reserva da Família","1.200"]
      ]},
      { title:"Vinhos Verdes", icon:"wine", items:[
        ["Aveleda Alvarinho","1.000"],["Gazela","900"],["Gatão","800"],["Casal Garcia","1.000"]
      ]}
    ]
  }
];

const tabsEl = document.getElementById('tabs');
const wrap = document.getElementById('menu-wrap');

function renderCategories(categories){
  wrap.innerHTML = categories.map((cat, i) => `
    <div class="category${i===0 ? ' open':''}" data-idx="${i}">
      <button class="category-head" aria-expanded="${i===0}">
        <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICONS[cat.icon]}</svg></span>
        <span class="name">${cat.title}</span>
        <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="6 9 12 15 18 9"/></svg>
      </button>
      <div class="category-body">
        <ul>
          ${cat.items.map(([name, price]) => `
            <li><span class="item-name">${name}</span><span class="dots"></span><span class="item-price">${price} MT</span></li>
          `).join('')}
        </ul>
      </div>
    </div>
  `).join('');

  document.querySelectorAll('.category').forEach(cat => {
    const body = cat.querySelector('.category-body');
    if(cat.classList.contains('open')) setHeight(body, true);
    cat.querySelector('.category-head').addEventListener('click', () => {
      const isOpen = cat.classList.contains('open');
      cat.classList.toggle('open', !isOpen);
      cat.querySelector('.category-head').setAttribute('aria-expanded', String(!isOpen));
      setHeight(body, !isOpen);
    });
  });
}

function setHeight(body, open){
  body.style.maxHeight = open ? body.scrollHeight + 'px' : '0px';
}

function selectGroup(id){
  GROUPS.forEach(g => {
    document.getElementById('tab-' + g.id).classList.toggle('active', g.id === id);
  });
  const group = GROUPS.find(g => g.id === id);
  renderCategories(group.categories);
}

tabsEl.innerHTML = GROUPS.map(g => `
  <button class="tab-btn" id="tab-${g.id}" data-id="${g.id}">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICONS[g.icon]}</svg>
    ${g.title}
  </button>
`).join('');

tabsEl.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => selectGroup(btn.dataset.id));
});

selectGroup(GROUPS[0].id);

window.addEventListener('resize', () => {
  document.querySelectorAll('.category.open .category-body').forEach(body => {
    body.style.maxHeight = body.scrollHeight + 'px';
  });
});
</script>
</body>
</html>
